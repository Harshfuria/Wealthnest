<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Drop Shadow for realistic badge feel -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Clip path to carve upper dark teal and lower vibrant colors -->
    <clipPath id="shieldClip">
      <path d="
    M 215,130
    Q 500,88 785,130
    Q 860,142 860,215
    L 842,670
    L 500,918
    L 158,670
    L 140,215
    Q 140,142 215,130
    Z
  " />
    </clipPath>
  </defs>

  <!-- Outer Dark Shield with Shadow -->
  <path d="
    M 210,105
    Q 500,60 790,105
    Q 885,120 885,210
    L 865,680
    Q 865,700 850,715
    L 500,945
    L 150,715
    Q 135,700 135,680
    L 115,210
    Q 115,120 210,105
    Z
  " fill="#012E36" filter="url(#badgeShadow)" />

  <!-- Inner Content Clipped Area -->
  <g clip-path="url(#shieldClip)">
    <!-- Top Dark Teal Section -->
    <rect x="0" y="0" width="1000" height="385" fill="#012E36" />

    <!-- Bottom Vibrant Color Section -->
    <rect x="0" y="385" width="1000" height="615" fill="#26C865" />

    <!-- Intuit Logo in White -->
    <g transform="translate(325, 185)">
      <!-- Custom vector letterforms for InTUIT -->
      <!-- I -->
      <path d="M 0,5 C 0,2 2,0 5,0 L 15,0 C 18,0 20,2 20,5 L 20,47 C 20,50 18,52 15,52 L 5,52 C 2,52 0,50 0,47 Z" fill="#FFFFFF" />
      <!-- n -->
      <path d="M 40,20 C 40,17 42,15 45,15 L 53,15 C 55,15 57,16 58,18 L 59,20 C 64,15 72,13 79,13 C 94,13 102,22 102,36 L 102,47 C 102,50 100,52 97,52 L 87,52 C 84,52 82,50 82,47 L 82,37 C 82,28 78,24 71,24 C 64,24 60,29 60,37 L 60,47 C 60,50 58,52 55,52 L 45,52 C 42,52 40,50 40,47 Z" fill="#FFFFFF" />
      <!-- T -->
      <path d="M 115,5 C 115,2 117,0 120,0 L 175,0 C 178,0 180,2 180,5 L 180,11 C 180,14 178,16 175,16 L 158,16 L 158,47 C 158,50 156,52 153,52 L 142,52 C 139,52 137,50 137,47 L 137,16 L 120,16 C 117,16 115,14 115,11 Z" fill="#FFFFFF" />
      <!-- U -->
      <path d="M 195,5 C 195,2 197,0 200,0 L 210,0 C 213,0 215,2 215,5 L 215,33 C 215,40 220,44 227,44 C 234,44 239,40 239,33 L 239,5 C 239,2 241,0 244,0 L 254,0 C 257,0 259,2 259,5 L 259,33 C 259,46 248,54 227,54 C 206,54 195,46 195,33 Z" fill="#FFFFFF" />
      <!-- I -->
      <path d="M 275,5 C 275,2 277,0 280,0 L 290,0 C 293,0 295,2 295,5 L 295,47 C 295,50 293,52 290,52 L 280,52 C 277,52 275,50 275,47 Z" fill="#FFFFFF" />
      <!-- T -->
      <path d="M 310,5 C 310,2 312,0 315,0 L 350,0 C 353,0 355,2 355,5 L 355,11 C 355,14 353,16 350,16 L 338,16 L 338,47 C 338,50 336,52 333,52 L 322,52 C 319,52 317,50 317,47 L 317,16 L 315,16 C 312,16 310,14 310,11 Z" fill="#FFFFFF" />
    </g>

    <!-- ProAdvisor Text -->
    <text
      x="500"
      y="318"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="62"
      font-weight="500"
      letter-spacing="0.5"
    >
      ProAdvisor
    </text>

    <!-- Main Title: QuickBooks -->
    <text
      x="500"
      y="525"
      text-anchor="middle"
      fill="#0B131F"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="78"
      font-weight="700"
      letter-spacing="-0.5"
    >
      QuickBooks
    </text>

    <!-- Subtitle: Level 1 / Level 2 / Workforce -->
    <text
      x="500"
      y="620"
      text-anchor="middle"
      fill="#0B131F"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="76"
      font-weight="700"
      letter-spacing="-0.5"
    >
      Level 2
    </text>

    <!-- Bottom Banner: CERTIFIED -->
    <text
      x="500"
      y="755"
      text-anchor="middle"
      fill="#1E293B"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="44"
      font-weight="600"
      letter-spacing="5"
    >
      CERTIFIED
    </text>
  </g>

  <!-- Crisp Inner Shield Outline Border -->
  <path
    d="
    M 215,130
    Q 500,88 785,130
    Q 860,142 860,215
    L 842,670
    L 500,918
    L 158,670
    L 140,215
    Q 140,142 215,130
    Z
  "
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linejoin="round"
  />
</svg>